name: "Publish"

env:
    NUGET_USER: "typpi"
    PESTER_VERSION: "6.0.1"
    PSSCRIPTANALYZER_VERSION: "1.25.0"
    PLATYPS_VERSION: "1.0.3"

on:
    workflow_dispatch:
        inputs:
            publishToNuGet:
                description: "Publish separately to NuGet.org using trusted publishing"
                required: false
                default: "true"
            versionOverride:
                description: "Override module version (optional)"
                required: false
                default: ""
            createRelease:
                description: "Create GitHub Release"
                required: false
                default: "true"
    release:
        types: ["published"]
    workflow_call:
        secrets:
            PSGALLERYAPIKEY:
                required: false

permissions:
    contents: "read"

concurrency:
    group: "publish-${{ github.sha }}"
    cancel-in-progress: true

jobs:
    validate-and-publish:
        name: "Validate and Publish"
        permissions:
            contents: "write"
        runs-on: "windows-latest"
        env:
            GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
            PSGALLERYAPIKEY: "${{ secrets.PSGALLERYAPIKEY }}"
            PUBLISH_TO_NUGET_INPUT: "${{ github.event.inputs.publishToNuGet }}"
            CREATE_RELEASE_INPUT: "${{ github.event.inputs.createRelease }}"
        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  ref: "${{ github.sha }}"
                  fetch-depth: 0
                  fetch-tags: true

            - name: "Install quality tools"
              run: |
                  Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
                  if (-not (Get-Module -ListAvailable -Name Pester | Where-Object Version -EQ $env:PESTER_VERSION)) {
                      Install-Module -Name Pester -RequiredVersion $env:PESTER_VERSION -Force -SkipPublisherCheck
                  }
                  if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object Version -EQ $env:PSSCRIPTANALYZER_VERSION)) {
                      Install-Module -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force -SkipPublisherCheck
                  }
                  if (-not (Get-Module -ListAvailable -Name Microsoft.PowerShell.PlatyPS | Where-Object Version -EQ $env:PLATYPS_VERSION)) {
                      Install-Module -Name Microsoft.PowerShell.PlatyPS -RequiredVersion $env:PLATYPS_VERSION -Force -SkipPublisherCheck
                  }
              shell: "pwsh"

            - name: "Set up Node"
              id: "setup-node"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  cache: "npm"
                  cache-dependency-path: "package-lock.json"

            - name: "Install dependencies"
              run: |
                  npm ci --force
              shell: "pwsh"

            - name: "Build module"
              env:
                  EVENT_NAME: "${{ github.event_name }}"
                  RELEASE_TAG: "${{ github.event.release.tag_name }}"
                  VERSION_OVERRIDE: "${{ github.event.inputs.versionOverride }}"
              run: |
                  $requestedVersion = if ($env:EVENT_NAME -eq 'release') {
                      $env:RELEASE_TAG -replace '^[vV]', ''
                  }
                  else {
                      $env:VERSION_OVERRIDE
                  }

                  $buildArguments = @('-NoProfile', '-File', './scripts/build.ps1')
                  if (-not [string]::IsNullOrWhiteSpace($requestedVersion)) {
                      try {
                          $normalizedVersion = ([version]$requestedVersion).ToString()
                      }
                      catch {
                          throw "Invalid requested version '$requestedVersion': $($_.Exception.Message)"
                      }

                      $buildArguments += '-Version', $normalizedVersion
                  }

                  pwsh @buildArguments
                  if ($LASTEXITCODE -ne 0) {
                      throw "Module build failed with exit code $LASTEXITCODE."
                  }

                  foreach ($scriptName in @('release:notes', 'release:notes:latest', 'verify', 'test:conversion', 'test:coverage')) {
                      npm run $scriptName
                      if ($LASTEXITCODE -ne 0) {
                          throw "npm run $scriptName failed with exit code $LASTEXITCODE."
                      }
                  }
              shell: "pwsh"

            - name: "Run Script Analyzer"
              run: "pwsh -NoProfile -File ./scripts/Lint-Module.ps1 -TreatWarningsAsErrors"
              shell: "pwsh"

            - name: "Run Pester tests"
              run: |
                  npm run test:pester
              shell: "pwsh"

            - name: "Verify manifest version"
              id: "manifest"
              env:
                  VERSION_OVERRIDE: "${{ github.event.inputs.versionOverride }}"
              shell: "pwsh"
              run: |
                  $manifest = Test-ModuleManifest -Path ./ColorScripts-Enhanced/ColorScripts-Enhanced.psd1
                  $version = $manifest.Version.ToString()

                  if (-not [string]::IsNullOrWhiteSpace($env:VERSION_OVERRIDE)) {
                      try {
                          $requestedVersion = ([version]$env:VERSION_OVERRIDE).ToString()
                      }
                      catch {
                          throw "Invalid version override '$($env:VERSION_OVERRIDE)': $($_.Exception.Message)"
                      }

                      if ($requestedVersion -cne $version) {
                          throw "Requested version override $requestedVersion does not match built manifest version $version."
                      }
                  }

                  Write-Host "Module version: $version"
                  "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

                  if ('${{ github.event_name }}' -eq 'release') {
                      $tag = '${{ github.event.release.tag_name }}'.TrimStart('v')
                      if ($tag -ne $version) {
                          throw "Release tag $tag does not match module version $version"
                      }
                  }

            - name: "Package module"
              id: "package"
              run: |
                  Import-Module PowerShellGet -ErrorAction Stop

                  $stagingPath = Join-Path $env:RUNNER_TEMP "module-packages"
                  if (Test-Path $stagingPath) {
                      Remove-Item -Path $stagingPath -Recurse -Force
                  }
                  New-Item -ItemType Directory -Path $stagingPath | Out-Null

                  $repoName = 'LocalModuleStaging'
                  if (Get-PSRepository -Name $repoName -ErrorAction SilentlyContinue) {
                      Unregister-PSRepository -Name $repoName -ErrorAction SilentlyContinue
                  }

                  Register-PSRepository -Name $repoName -SourceLocation $stagingPath -PublishLocation $stagingPath -InstallationPolicy Trusted

                  $readmePath = Join-Path (Get-Location) 'ColorScripts-Enhanced/README.md'
                  if (-not (Test-Path $readmePath)) {
                      throw "README file not found at $readmePath"
                  }

                  try {
                      Publish-Module -Path ./ColorScripts-Enhanced -Repository $repoName -NuGetApiKey 'LocalRepositoryKey' -ErrorAction Stop | Out-Null
                  }
                  finally {
                      Unregister-PSRepository -Name $repoName -ErrorAction SilentlyContinue
                  }

                  $package = Get-ChildItem -Path $stagingPath -Filter '*.nupkg' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
                  if (-not $package) {
                      throw 'Failed to produce NuGet package for the module.'
                  }

                  "packagePath=$($package.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  "packageName=$($package.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  Write-Host "Packaged module to: $($package.FullName)"
              shell: "pwsh"

            - name: "Normalize NuGet metadata"
              run: "pwsh -NoProfile -File ./scripts/Update-NuGetPackageMetadata.ps1 -PackagePath '${{ steps.package.outputs.packagePath }}'"
              shell: "pwsh"

            - name: "Stage package for NuGet.org trusted publishing"
              if: "${{ github.event_name != 'workflow_dispatch' || env.PUBLISH_TO_NUGET_INPUT != 'false' }}"
              uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
              with:
                  name: "nuget-package"
                  path: "${{ steps.package.outputs.packagePath }}"
                  if-no-files-found: "error"
                  retention-days: 1
                  compression-level: 0

            - name: "Prepare expected release tag for non-release runs"
              if: "${{ github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || env.CREATE_RELEASE_INPUT != 'false') }}"
              env:
                  EXPECTED_TAG: "v${{ steps.manifest.outputs.version }}"
              run: |
                  $ErrorActionPreference = 'Stop'
                  $expectedTag = $env:EXPECTED_TAG

                  if ([string]::IsNullOrWhiteSpace($expectedTag)) {
                      Write-Output '::error::The manifest version step did not provide an expected tag.'
                      exit 1
                  }

                  git fetch --tags --force
                  if ($LASTEXITCODE -ne 0) {
                      Write-Output '::error::Failed to fetch release tags before preparing the expected tag.'
                      exit 1
                  }

                  git show-ref --verify --quiet "refs/tags/$expectedTag"
                  $tagStatus = $LASTEXITCODE
                  if ($tagStatus -eq 0) {
                      $tagCommit = (git rev-parse "${expectedTag}^{commit}").Trim()
                      if ($LASTEXITCODE -ne 0) {
                          Write-Output "::error::Unable to resolve existing release tag $expectedTag."
                          exit 1
                      }

                      $headCommit = (git rev-parse HEAD).Trim()
                      if ($LASTEXITCODE -ne 0) {
                          Write-Output '::error::Unable to resolve HEAD while validating the existing release tag.'
                          exit 1
                      }

                      if ($tagCommit -cne $headCommit) {
                          Write-Output "::error::Existing release tag $expectedTag points to $tagCommit, but HEAD is $headCommit; refusing to replace it."
                          exit 1
                      }

                      Write-Host "Reusing expected release tag $expectedTag at $headCommit."
                  }
                  elseif ($tagStatus -ne 1) {
                      Write-Output "::error::Unable to determine whether expected release tag $expectedTag already exists."
                      exit 1
                  }
                  else {
                      git tag -- $expectedTag HEAD
                      if ($LASTEXITCODE -ne 0) {
                          Write-Output "::error::Failed to create expected release tag $expectedTag at HEAD."
                          exit 1
                      }
                  }
              shell: "pwsh"

            - name: "Validate expected release tag"
              if: "${{ github.event_name != 'workflow_dispatch' || env.CREATE_RELEASE_INPUT != 'false' }}"
              env:
                  EXPECTED_TAG: "v${{ steps.manifest.outputs.version }}"
              run: |
                  $ErrorActionPreference = 'Stop'
                  $expectedTag = $env:EXPECTED_TAG

                  if ([string]::IsNullOrWhiteSpace($expectedTag)) {
                      Write-Output '::error::The manifest version step did not provide an expected tag.'
                      exit 1
                  }

                  $tagRef = "refs/tags/$expectedTag"
                  git show-ref --verify --quiet $tagRef
                  if ($LASTEXITCODE -ne 0) {
                      Write-Output "::error::Expected release tag $expectedTag does not exist in the local checkout."
                      exit 1
                  }

                  $tagCommit = (git rev-parse "${tagRef}^{commit}").Trim()
                  if ($LASTEXITCODE -ne 0) {
                      Write-Output "::error::Unable to resolve expected release tag $expectedTag to a commit."
                      exit 1
                  }

                  $headCommit = (git rev-parse HEAD).Trim()
                  if ($LASTEXITCODE -ne 0) {
                      Write-Output '::error::Unable to resolve the current HEAD commit.'
                      exit 1
                  }

                  if ($tagCommit -cne $headCommit) {
                      Write-Output "::error::Expected release tag $expectedTag points to $tagCommit, but HEAD is $headCommit."
                      exit 1
                  }

                  $headTags = @(git tag --points-at HEAD --sort=refname)
                  if ($LASTEXITCODE -ne 0) {
                      Write-Output '::error::Unable to list tags that point at HEAD.'
                      exit 1
                  }

                  if ($headTags.Count -ne 1 -or $headTags[0] -cne $expectedTag) {
                      $foundTags = if ($headTags.Count -eq 0) { '<none>' } else { $headTags -join ', ' }
                      Write-Output "::error::HEAD must have exactly the expected release tag $expectedTag; found: $foundTags."
                      exit 1
                  }
              shell: "pwsh"

            - name: "Generate release notes"
              if: "${{ github.event_name != 'workflow_dispatch' || env.CREATE_RELEASE_INPUT != 'false' }}"
              id: "release-notes"
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
              run: |
                  $version = '${{ steps.manifest.outputs.version }}'
                  Write-Host "Generating release notes for version $version"

                  $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
                  $expectedTag = "v$version"
                  $releaseBaseTag = (& git describe --tags --abbrev=0 "$expectedTag^").Trim()
                  if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releaseBaseTag)) {
                      throw "Unable to determine the release base tag for $expectedTag."
                  }

                  $releaseCommitLines = @(& git log '--format=%H%x09%s' "$releaseBaseTag..HEAD")
                  if ($LASTEXITCODE -ne 0) {
                      throw "Unable to inspect release preparation commits after $releaseBaseTag."
                  }

                  $gitCliffArguments = @(
                      '--config', 'node_modules/gitcliff-config-nick2bad4u/cliff.toml',
                      '--github-repo', 'Nick2bad4u/PS-Color-Scripts-Enhanced',
                      '--current',
                      '--output', $notesFile
                  )
                  $releasePreparationPattern = '^🧹 \[chore\] Prepare release \d+(?:\.\d+){1,3}$'
                  foreach ($line in $releaseCommitLines) {
                      $parts = $line -split "`t", 2
                      if ($parts.Count -ne 2 -or $parts[1] -notmatch $releasePreparationPattern) {
                          continue
                      }
                      if ($parts[0] -notmatch '^[0-9a-f]{40}$') {
                          throw "Invalid release preparation commit hash '$($parts[0])'."
                      }

                      $gitCliffArguments += '--skip-commit', $parts[0]
                  }

                  npx git-cliff @gitCliffArguments
                  if ($LASTEXITCODE -ne 0) {
                      throw "git-cliff failed to generate release notes for v$version."
                  }

                  $notes = if (Test-Path -LiteralPath $notesFile) {
                      Get-Content -LiteralPath $notesFile -Raw
                  } else {
                      ''
                  }

                  if ([string]::IsNullOrWhiteSpace($notes)) {
                      Write-Warning "No release notes generated, using fallback"
                      $notes = @"
                  ## Release v$version

                  See [CHANGELOG.md](https://github.com/Nick2bad4u/ps-color-scripts-enhanced/blob/main/CHANGELOG.md) for full details.
                  "@
                      Set-Content -LiteralPath $notesFile -Value $notes -Encoding UTF8
                  }

                  $boundedNotesFile = Join-Path $env:RUNNER_TEMP "release-notes-bounded.md"
                  node ./scripts/Limit-GitHubReleaseNotes.mjs `
                      "--input=$notesFile" `
                      "--output=$boundedNotesFile" `
                      "--version=$version" `
                      "--maximum-characters=120000"
                  if ($LASTEXITCODE -ne 0) {
                      throw "GitHub release-note limiting failed for v$version."
                  }

                  $notesFile = $boundedNotesFile
                  $notes = Get-Content -LiteralPath $notesFile -Raw
                  $previewLength = [Math]::Min($notes.Length, 4000)

                  Write-Host "Release notes preview:"
                  Write-Host "------------------------"
                  Write-Host $notes.Substring(0, $previewLength)
                  if ($notes.Length -gt $previewLength) {
                      Write-Host "... preview limited to $previewLength characters ..."
                  }
                  Write-Host "------------------------"

                  "notesFile=$notesFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              shell: "pwsh"

            - name: "Create GitHub Release"
              if: "${{ github.event_name != 'workflow_dispatch' || env.CREATE_RELEASE_INPUT != 'false' }}"
              uses: "ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd" # v1.21.0
              with:
                  tag: "v${{ steps.manifest.outputs.version }}"
                  commit: "${{ github.sha }}"
                  name: "Release v${{ steps.manifest.outputs.version }}"
                  bodyFile: "${{ steps.release-notes.outputs.notesFile }}"
                  artifacts: "${{ steps.package.outputs.packagePath }}"
                  draft: false
                  prerelease: false
                  allowUpdates: true
                  updateOnlyUnreleased: false
                  skipIfReleaseExists: false

            - name: "Publish to PowerShell Gallery"
              run: |
                  $packagePath = '${{ steps.package.outputs.packagePath }}'
                  if (-not (Test-Path $packagePath)) {
                      throw "Package not found at $packagePath"
                  }

                  $apiKey = $env:PSGALLERYAPIKEY
                  if ([string]::IsNullOrWhiteSpace($apiKey)) {
                      Write-Host 'No PowerShell Gallery API key provided. Skipping publish.'
                      return
                  }

                  Write-Host "Publishing $packagePath to PowerShell Gallery"
                  dotnet nuget push $packagePath --api-key $apiKey --source https://www.powershellgallery.com/api/v2/package --skip-duplicate
              shell: "pwsh"

    publish-nuget:
        name: "Publish to NuGet.org"
        if: "${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publishToNuGet != 'false' }}"
        needs: ["validate-and-publish"]
        permissions:
            contents: "read"
            id-token: "write"
        runs-on: "ubuntu-latest"
        steps:
            - name: "Download verified package"
              uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
              with:
                  name: "nuget-package"
                  path: "nuget-package"

            - name: "Authenticate to NuGet.org"
              id: "nuget-login"
              uses: "NuGet/login@8d196754b4036150537f80ac539e15c2f1028841" # v1.2.0
              with:
                  user: "${{ env.NUGET_USER }}"

            - name: "Publish package"
              env:
                  NUGET_API_KEY: "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
              run: |
                  $packages = @(Get-ChildItem -LiteralPath './nuget-package' -Filter '*.nupkg' -File)
                  if ($packages.Count -ne 1) {
                      throw "Expected exactly one NuGet package, but found $($packages.Count)."
                  }

                  if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
                      throw 'NuGet trusted publishing did not return a temporary API key.'
                  }

                  Write-Host "Publishing $($packages[0].Name) to NuGet.org with a temporary trusted-publishing credential"
                  dotnet nuget push $packages[0].FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
              shell: "pwsh"
