<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <title>Artwork details · PowerShell ColorScripts Enhanced</title>
        <style>
            :root {
                color-scheme: dark;
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                background: #0d1117;
                color: #e6edf3;
            }
            body {
                max-width: 72rem;
                margin: 0 auto;
                padding: 2rem 1rem 4rem;
            }
            a {
                color: #58a6ff;
            }
            .status {
                padding: 1rem;
                border: 1px solid #30363d;
                border-radius: 0.5rem;
                background: #161b22;
            }
            dl {
                display: grid;
                grid-template-columns: minmax(10rem, 14rem) 1fr;
                gap: 0;
                border: 1px solid #30363d;
                border-radius: 0.5rem;
                overflow: hidden;
            }
            dt,
            dd {
                margin: 0;
                padding: 0.7rem 0.9rem;
                border-bottom: 1px solid #30363d;
                overflow-wrap: anywhere;
            }
            dt {
                font-weight: 600;
                background: #161b22;
            }
            dd:last-child,
            dt:nth-last-child(2) {
                border-bottom: 0;
            }
            @media (max-width: 42rem) {
                dl {
                    grid-template-columns: 1fr;
                }
                dt {
                    border-bottom: 0;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <p><a href="../README.html">PowerShell ColorScripts Enhanced</a></p>
            <h1 id="title">Artwork details</h1>
            <output
                id="status"
                class="status"
                >Loading provenance…</output
            >
            <dl
                id="details"
                hidden
            ></dl>
        </main>
        <script>
            "use strict";

            const scriptName = new URLSearchParams(location.search).get(
                "script"
            );
            const status = document.querySelector("#status");
            const details = document.querySelector("#details");
            const title = document.querySelector("#title");

            function appendValue(label, value) {
                if (value === null || value === undefined || value === "")
                    return;
                const term = document.createElement("dt");
                term.textContent = label.replace(/([a-z])([A-Z])/g, "$1 $2");
                const description = document.createElement("dd");
                if (typeof value === "string" && /^https?:\/\//.test(value)) {
                    const link = document.createElement("a");
                    link.href = value;
                    link.rel = "noreferrer";
                    link.textContent = value;
                    description.append(link);
                } else {
                    description.textContent = Array.isArray(value)
                        ? value.join(" · ")
                        : String(value);
                }
                details.append(term, description);
            }

            async function load() {
                if (!scriptName || !/^[a-z0-9][a-z0-9-]*$/.test(scriptName)) {
                    throw new Error(
                        "The artwork URL does not contain a valid script identifier."
                    );
                }
                const response = await fetch(
                    "./assets/artwork-provenance.json"
                );
                if (!response.ok) {
                    throw new Error(
                        `Unable to load artwork provenance (${response.status}).`
                    );
                }
                const index = await response.json();
                const values = index.scripts?.[scriptName];
                if (
                    !Array.isArray(values) ||
                    values.length !== index.fields.length
                ) {
                    throw new Error(
                        `No artwork provenance exists for ${scriptName}.`
                    );
                }
                const record = Object.fromEntries(
                    index.fields.map((field, position) => [
                        field,
                        values[position],
                    ])
                );
                title.textContent = `${record.Title} by ${record.Artist}`;
                document.title = `${record.Title} by ${record.Artist} · Artwork details`;
                appendValue("Script", scriptName);
                for (const field of index.fields)
                    appendValue(field, record[field]);
                const collection = index.collections?.[record.Collection];
                if (collection) {
                    appendValue("Collection license", collection.License);
                    appendValue("Collection project", collection.ProjectUrl);
                    appendValue("License evidence", collection.LicenseEvidence);
                }
                status.hidden = true;
                details.hidden = false;
            }

            load().catch((error) => {
                status.textContent =
                    error instanceof Error ? error.message : String(error);
            });
        </script>
    </body>
</html>
